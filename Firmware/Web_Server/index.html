<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tercio Control</title>
  <meta name="description" content="Configure, command and monitor Tercio S1 closed-loop stepper drivers over CAN-FD, from the browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%232f5be6' stroke-width='2.5'/%3E%3Cpath d='M9 11h14M16 11v12' stroke='%232f5be6' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/app.css">
  <script>
    // Apply the saved theme before first paint (no flash).
    try {
      const theme = JSON.parse(localStorage.getItem('tercio.theme'));
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-action="go" data-target="fleet" aria-label="Tercio Control, overview">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 11h14M16 11v12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      <span class="brand-name">Tercio <span>Control</span></span>
    </a>
    <div class="link-status" id="link-status"></div>
    <div class="topbar-spacer"></div>
    <div class="seg" id="unit-switch" role="radiogroup" aria-label="Position unit"></div>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Theme"></button>
    <button class="btn btn-stop" id="stop-all" type="button" title="Decelerate every motor to a stop (Esc)" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      <span>Stop all</span>
      <kbd>Esc</kbd>
    </button>
  </header>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="Devices"></nav>
    <main class="stage" id="stage"></main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <dialog class="modal" id="modal">
    <form method="dialog" class="modal-body">
      <h2 id="modal-title"></h2>
      <div id="modal-text" class="modal-text"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" value="cancel" type="submit">Cancel</button>
        <button class="btn" id="modal-confirm" value="confirm" type="submit">Confirm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
