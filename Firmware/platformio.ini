; Tercio S1 closed-loop stepper driver firmware.
;
; The firmware has no third-party library dependencies: it builds against the
; STM32duino core and ST's HAL only. Platform and core are pinned so a fresh
; checkout builds exactly what was tested.

[platformio]
default_envs = tercio_s1

[env:tercio_s1]
platform = platformio/ststm32@20.0.0
board = genericSTM32G431CB
framework = arduino
upload_protocol = stlink
debug_tool = stlink

build_unflags = -Os
build_flags =
	-O2
	-I src
	-D HAL_FDCAN_MODULE_ENABLED
	-D HAL_TIM_MODULE_ONLY
	-D HSE_VALUE=16000000UL
	-Wall
	-Wextra
	-Wdouble-promotion
	-Wno-unused-parameter

; Host-side unit tests for the hardware-independent modules (planner,
; controller, encoder tracking, parameters, protocol codec).
; Run with: pio test -e native
[env:native]
platform = native
build_flags = -std=c++17 -I src -Wall -Wextra -D UNITY_INCLUDE_DOUBLE
build_src_filter = -<*> +<control/*.cpp> +<app/Params.cpp>
test_build_src = yes
